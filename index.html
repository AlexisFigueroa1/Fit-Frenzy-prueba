<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fit Frenzy - Arcade Fitness Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* RESET Y ESTILOS BASE DEL JUEGO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        body {
            background-color: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #f0f0f0;
            font-family: 'Press Start 2P', monospace;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #0f0f25;
            display: block;
            image-rendering: crisp-edges;
            touch-action: none;
            box-shadow: 0 0 0 2px rgba(58,110,165,0.3);
            z-index: 5;
        }
        
        /* UI flotante del juego */
        #ui {
            position: absolute;
            top: 12px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 12px;
            pointer-events: none;
            z-index: 10;
            gap: 8px;
        }
        
        #scoreContainer, #centerUI, #healthContainer {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 6px 12px;
            border-radius: 12px;
            border: 2px solid #3a6ea5;
            backdrop-filter: blur(8px);
            min-width: 80px;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.7rem;
        }
        
        #scoreLabel, #intensityLabel, #timeLabel, #healthLabel {
            font-size: 8px;
            letter-spacing: 1px;
        }
        
        #scoreLabel { color: #64c864; }
        #intensityLabel { color: #ffd700; }
        #timeLabel { color: #40b4dc; }
        #healthLabel { color: #dc4646; margin-bottom: 4px; }
        
        #score, #intensity, #time {
            font-weight: bold;
            color: white;
            font-size: 1rem;
        }
        
        #score { text-shadow: 0 0 5px #64c864; }
        #intensity { color: #ffd700; text-shadow: 0 0 5px #ffd700; }
        
        #healthBar {
            width: 90px;
            height: 12px;
            background-color: #2a2a3a;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 4px;
        }
        #healthFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #dc4646, #ffaa66, #64c864);
            border-radius: 20px;
            transition: width 0.2s ease;
        }
        #healthText {
            font-size: 8px;
            font-weight: bold;
            margin-top: 2px;
        }
        
        /* Pantallas modales (pausa, game over) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: rgba(10, 10, 26, 0.98);
            backdrop-filter: blur(8px);
            z-index: 20;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            font-family: 'Press Start 2P', monospace;
        }
        
        .screen.hidden {
            display: none;
        }
        
        button {
            background: linear-gradient(145deg, #3a6ea5, #2d5685);
            color: white;
            border: none;
            padding: 14px 28px;
            margin: 8px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-family: 'Press Start 2P', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s linear;
            min-width: 180px;
            box-shadow: 0 5px 0 #1a2e46;
            touch-action: manipulation;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a2e46;
        }
        
        .boost-indicator {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: gold;
            color: black;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            z-index: 15;
            display: none;
            white-space: nowrap;
            font-size: 0.8rem;
            box-shadow: 0 0 15px gold;
            font-family: 'Press Start 2P', monospace;
        }
        
        .damage-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(220,0,0,0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 6;
        }
        
        .record-container {
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            padding: 12px 24px;
            margin: 16px;
            border: 1px solid gold;
        }
        
        /* ===== MENÚ PIXELADO CON LLUVIA DE COMIDA ===== */
        .pixel-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: #0b1e3c;
            overflow: hidden;
            font-family: 'Press Start 2P', monospace;
        }
        
        .pixel-menu.hidden {
            display: none;
        }
        
        .menu-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url("fondo.jpeg") no-repeat center center / cover;
            z-index: 0;
        }
        
        /* Elementos de comida cayendo (lluvia) */
        .food-rain {
            position: absolute;
            pointer-events: none;
            z-index: 2;
            will-change: transform;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100px); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0.8; }
        }
        
        .menu-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.2);
            text-align: center;
            z-index: 20;
            width: 90%;
        }
        
        .title {
            font-size: 30px;
            color: white;
            margin-bottom: 60px;
            letter-spacing: 4px;
            text-shadow: 6px 0 #000, 0 6px #000, 6px 6px #000, 12px 12px #000;
        }
        
        .menu-button {
            display: block;
            margin: 25px auto;
            padding: 18px 35px;
            font-size: 10px;
            color: white;
            background: #1d4ed8;
            border: 6px solid black;
            box-shadow: 6px 0 black, 0 6px black, 12px 12px black;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            width: 220px;
        }
        
        .menu-button:hover { background: #3b82f6; }
        .menu-button:active {
            transform: translate(6px,6px);
            box-shadow: 2px 0 black, 0 2px black;
        }
        
        /* Ajustes responsivos */
        @media (max-width: 700px), (max-height: 700px) {
            .title { font-size: 20px; margin-bottom: 30px; }
            .menu-button { padding: 12px 20px; font-size: 8px; width: 180px; margin: 15px auto; }
            .food-rain { width: 30px; height: 30px; }
        }
        
        /* Ocultar controles táctiles del juego mientras se muestra el menú */
        #touchControls {
            display: none;
        }
    </style>
</head>
<body>
<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="damageEffect" class="damage-effect"></div>
    
    <!-- UI del juego (visible solo durante la partida) -->
    <div id="ui" style="display: none;">
        <div id="scoreContainer"><div id="scoreLabel">PUNTOS</div><div id="score">0</div></div>
        <div id="centerUI">
            <div id="intensityLabel">INTENSIDAD</div>
            <div id="intensity">1.0x</div>
            <div id="timeLabel">TIEMPO</div>
            <div id="time">00:00</div>
        </div>
        <div id="healthContainer">
            <div id="healthLabel">SALUD</div>
            <div id="healthBar"><div id="healthFill" style="width:100%"></div></div>
            <div id="healthText">100%</div>
        </div>
    </div>
    
    <div id="boostIndicator" class="boost-indicator">⚡ BOOST VELOCIDAD ⚡</div>
    
    <!-- MENÚ PIXELADO CON LLUVIA DE COMIDA -->
    <div id="pixelMenu" class="pixel-menu">
        <div class="menu-background"></div>
        <div class="menu-content">
            <div class="title">FIT FRENZY</div>
            <button class="menu-button" id="menuJugar">JUGAR</button>
            <button class="menu-button" id="menuOpciones">OPCIONES</button>
            <button class="menu-button" id="menuSalir">SALIR</button>
        </div>
    </div>
    
    <!-- Pantalla de pausa -->
    <div id="pauseScreen" class="screen hidden">
        <h1>⏸ PAUSA</h1>
        <button id="resumeButton">CONTINUAR</button>
        <button id="restartButton">REINICIAR</button>
        <button id="menuButton">MENÚ</button>
    </div>
    
    <!-- Pantalla de Game Over -->
    <div id="gameOverScreen" class="screen hidden">
        <h1>💀 GAME OVER 💀</h1>
        <p>Puntuación: <span id="finalScore">0</span></p>
        <p>Intensidad: <span id="finalIntensity">1.0x</span></p>
        <p>Tiempo: <span id="finalTime">00:00</span></p>
        <div class="record-container" id="recordContainer">
            <div>🏆 MEJOR PUNTUACIÓN 🏆</div>
            <div id="recordScore" style="font-size: 1.8rem;">0</div>
            <div id="recordDetails"></div>
        </div>
        <div id="newRecordMessage" style="display: none; background: gold; color:black; padding: 8px; border-radius: 20px; margin: 8px;">🎉 NUEVO RÉCORD 🎉</div>
        <button id="playAgainButton">JUGAR DE NUEVO</button>
        <button id="menuButton2">MENÚ PRINCIPAL</button>
    </div>
</div>

<script>
    // ======================== SISTEMA DE SONIDOS (Web Audio API) ========================
    let audioCtx = null;
    let bgMusicNode = null;
    let bgMusicGain = null;
    let isAudioAllowed = false;
    let currentMusicInterval = null;

    // Inicializar AudioContext (se activa con la primera interacción del usuario)
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgMusicGain = audioCtx.createGain();
        bgMusicGain.gain.value = 0.3; // volumen música fondo
        bgMusicGain.connect(audioCtx.destination);
    }

    // Reproducir un sonido de "clic" (botones)
    function playClickSound() {
        if (!audioCtx || !isAudioAllowed) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.2);
        osc.stop(now + 0.2);
    }

    // Sonido de inicio del juego (fanfarria)
    function playStartSound() {
        if (!audioCtx || !isAudioAllowed) return;
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'square';
        osc1.frequency.value = 523.25; // Do5
        gain1.gain.value = 0.15;
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start();
        gain1.gain.exponentialRampToValueAtTime(0.00001, now + 0.3);
        osc1.stop(now + 0.3);
        
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'square';
        osc2.frequency.value = 659.25; // Mi5
        gain2.gain.value = 0.15;
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.00001, now + 0.45);
        osc2.stop(now + 0.45);
    }

    // Sonido al recolectar comida buena (ding)
    function playGoodCollectSound() {
        if (!audioCtx || !isAudioAllowed) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1046.50; // Do6
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.15);
        osc.stop(now + 0.15);
    }

    // Sonido al recibir daño (buzz grave)
    function playDamageSound() {
        if (!audioCtx || !isAudioAllowed) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 220;
        gain.gain.value = 0.2;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.25);
        osc.stop(now + 0.25);
    }

    // Sonido Game Over
    function playGameOverSound() {
        if (!audioCtx || !isAudioAllowed) return;
        const now = audioCtx.currentTime;
        for (let i = 0; i < 3; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 440 - i * 100;
            gain.gain.value = 0.15;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.00001, now + i * 0.1 + 0.3);
            osc.stop(now + i * 0.1 + 0.3);
        }
    }

    // Música de fondo (loop con sintetizador simple)
    let musicInterval = null;
    function startBackgroundMusic() {
        if (!audioCtx || !isAudioAllowed) return;
        stopBackgroundMusic();
        let step = 0;
        const notes = [261.63, 293.66, 329.63, 261.63, 261.63, 293.66, 329.63, 261.63]; // Frase simple
        musicInterval = setInterval(() => {
            if (gameState !== 'playing') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = notes[step % notes.length];
            gain.gain.value = 0.08;
            osc.connect(gain);
            gain.connect(bgMusicGain);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.4);
            osc.stop(now + 0.4);
            step++;
        }, 500);
    }

    function stopBackgroundMusic() {
        if (musicInterval) {
            clearInterval(musicInterval);
            musicInterval = null;
        }
    }

    // Activar audio en el primer clic del usuario
    function enableAudioAndPlayClick(e) {
        if (isAudioAllowed) return;
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().then(() => {
                isAudioAllowed = true;
                playClickSound();
            });
        } else {
            isAudioAllowed = true;
            playClickSound();
        }
        // Remover listener después de activar
        document.removeEventListener('click', enableAudioAndPlayClick);
        document.removeEventListener('touchstart', enableAudioAndPlayClick);
    }
    document.addEventListener('click', enableAudioAndPlayClick);
    document.addEventListener('touchstart', enableAudioAndPlayClick);

    // ========== LISTAS DE ALIMENTOS ==========
    const GOOD_FOODS = [
        { id: 'creatina', name: 'Creatina', color: '#c084fc', value: 20, shape: 'diamond', size: 28 },
        { id: 'proteina', name: 'Proteína', color: '#d878d8', value: 15, shape: 'circle', size: 25 },
        { id: 'barra', name: 'Barra energética', color: '#fbbf24', value: 12, shape: 'square', size: 26 },
        { id: 'lechuga', name: 'Lechuga', color: '#86efac', value: 8, shape: 'circle', size: 24 },
        { id: 'ensalada', name: 'Ensalada', color: '#a3e635', value: 12, shape: 'square', size: 26 },
        { id: 'manzana', name: 'Manzana', color: '#ef4444', value: 10, shape: 'circle', size: 22 },
        { id: 'agua', name: 'Agua', color: '#60a5fa', value: 5, shape: 'circle', size: 20 },
        { id: 'brocoli', name: 'Brócoli', color: '#22c55e', value: 10, shape: 'triangle', size: 24 },
        { id: 'pollo', name: 'Pollo', color: '#facc15', value: 20, shape: 'square', size: 27 }
    ];
    
    const BAD_FOODS = [
        { id: 'soda', name: 'Soda', color: '#f87171', value: -15, shape: 'circle', size: 26 },
        { id: 'tacos', name: 'Tacos', color: '#b45309', value: -20, shape: 'square', size: 28 },
        { id: 'pizza', name: 'Pizza', color: '#dc2626', value: -25, shape: 'square', size: 30 },
        { id: 'hotdog', name: 'Hot dog', color: '#d97706', value: -18, shape: 'triangle', size: 27 },
        { id: 'dona', name: 'Dona', color: '#f9a8d4', value: -12, shape: 'circle', size: 24 },
        { id: 'helado', name: 'Helado', color: '#fbcfe8', value: -18, shape: 'triangle', size: 26 },
        { id: 'papas', name: 'Papas fritas', color: '#fcd34d', value: -12, shape: 'square', size: 23 },
        { id: 'galletas', name: 'Galletas', color: '#d4a373', value: -10, shape: 'circle', size: 22 },
        { id: 'pastel', name: 'Pastel', color: '#fdba74', value: -20, shape: 'triangle', size: 28 }
    ];
    
    const ALL_FOODS = [...GOOD_FOODS, ...BAD_FOODS];
    
    // Config responsive
    let canvas, ctx;
    let gameWidth = 800;
    let gameHeight = 1000;
    
    function updateCanvasSize() {
        const maxW = window.innerWidth;
        const maxH = window.innerHeight;
        const targetRatio = 800/1000;
        let newWidth = maxW;
        let newHeight = newWidth / targetRatio;
        if(newHeight > maxH) {
            newHeight = maxH;
            newWidth = newHeight * targetRatio;
        }
        gameWidth = Math.floor(newWidth);
        gameHeight = Math.floor(newHeight);
        canvas.width = gameWidth;
        canvas.height = gameHeight;
        canvas.style.width = `${gameWidth}px`;
        canvas.style.height = `${gameHeight}px`;
        
        if(player) {
            player.x = Math.min(Math.max(player.x, 0), gameWidth - player.width);
            player.y = gameHeight - 90;
        }
    }
    
    // Variables juego
    let gameState = 'menu';
    let player = {
        x: 0, y: 0, width: 70, height: 35,
        speed: 7, score: 0, health: 100, maxHealth: 100,
        speedBoost: 0, boostTimer: 0,
        update() { if(this.boostTimer > 0) { this.boostTimer--; if(this.boostTimer===0) this.speedBoost=0; } },
        move(dir) {
            let step = this.speed + this.speedBoost;
            if(dir === 'left') this.x -= step;
            if(dir === 'right') this.x += step;
            this.x = Math.max(0, Math.min(gameWidth - this.width, this.x));
        },
        getBounds() { return { x: this.x-10, y: this.y-10, width: this.width+20, height: this.height+20 }; },
        applyBoost() { this.speedBoost = 6; this.boostTimer = 150; },
        takeDamage(amt) { this.health = Math.max(0, this.health + amt); showDamage(); },
        reset() {
            this.x = gameWidth/2 - this.width/2;
            this.y = gameHeight - 90;
            this.score = 0;
            this.health = this.maxHealth;
            this.speedBoost = 0; this.boostTimer = 0;
        }
    };
    
    let fallingObjects = [];
    let spawnCounter = 0;
    let spawnRate = 70;
    let gameTimer = 0;
    let gameIntensity = 1.0;
    let objectsPerSpawn = 1;
    let highScore = { score: 0, intensity: 1.0, time: 0 };
    let keys = { ArrowLeft: false, ArrowRight: false };
    
    // Elementos UI
    const scoreEl = document.getElementById('score');
    const intensityEl = document.getElementById('intensity');
    const timeEl = document.getElementById('time');
    const healthFill = document.getElementById('healthFill');
    const healthText = document.getElementById('healthText');
    const boostIndicator = document.getElementById('boostIndicator');
    const damageOverlay = document.getElementById('damageEffect');
    const uiContainer = document.getElementById('ui');
    
    function showDamage() { damageOverlay.style.opacity = '0.5'; setTimeout(()=> damageOverlay.style.opacity='0', 150); }
    function updateUI() {
        if(gameState !== 'playing') return;
        scoreEl.textContent = player.score;
        let percent = (player.health / player.maxHealth) * 100;
        healthFill.style.width = `${percent}%`;
        healthText.textContent = `${Math.floor(percent)}%`;
        let mins = Math.floor(gameTimer / 3600);
        let secs = Math.floor((gameTimer % 3600) / 60);
        timeEl.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        intensityEl.textContent = `${gameIntensity.toFixed(1)}x`;
    }
    
    function updateIntensityByScore() {
        let target = 1.0 + Math.floor(player.score / 100) * 0.1;
        if(target > gameIntensity) gameIntensity = Math.min(gameIntensity + 0.002, target);
        spawnRate = Math.max(38, 70 / gameIntensity);
        objectsPerSpawn = Math.min(1 + Math.floor(gameIntensity), 4);
        updateUI();
    }
    
    class FallingItem {
        constructor(isGood) {
            this.isGood = isGood;
            const list = isGood ? GOOD_FOODS : BAD_FOODS;
            const data = list[Math.floor(Math.random() * list.length)];
            this.name = data.name;
            this.color = data.color;
            this.value = data.value;
            this.shape = data.shape;
            this.size = data.size + Math.random() * 6;
            this.x = Math.random() * (gameWidth - this.size - 20) + 10;
            this.y = -this.size;
            this.speedY = (Math.random() * 2.5 + 2) * gameIntensity;
            this.rot = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.1;
        }
        update() { this.y += this.speedY; this.rot += this.rotSpeed; }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x + this.size/2, this.y + this.size/2);
            ctx.rotate(this.rot);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = this.isGood ? 8 : 0;
            ctx.shadowColor = this.isGood ? this.color : 'transparent';
            if(this.shape === 'circle') { ctx.beginPath(); ctx.arc(0,0, this.size/2, 0, Math.PI*2); ctx.fill(); }
            else if(this.shape === 'square') { ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size); }
            else if(this.shape === 'triangle') { ctx.beginPath(); ctx.moveTo(0, -this.size/2); ctx.lineTo(-this.size/2, this.size/2); ctx.lineTo(this.size/2, this.size/2); ctx.fill(); }
            else if(this.shape === 'diamond') { ctx.beginPath(); ctx.moveTo(0, -this.size/2); ctx.lineTo(-this.size/2,0); ctx.lineTo(0, this.size/2); ctx.lineTo(this.size/2,0); ctx.fill(); }
            ctx.shadowBlur = 0;
            if(!this.isGood) {
                ctx.strokeStyle = 'black'; ctx.lineWidth=2;
                ctx.beginPath(); ctx.moveTo(-this.size/3,-this.size/3); ctx.lineTo(this.size/3,this.size/3); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(this.size/3,-this.size/3); ctx.lineTo(-this.size/3,this.size/3); ctx.stroke();
            }
            ctx.restore();
        }
        getBounds() { return { x: this.x, y: this.y, width: this.size, height: this.size }; }
        isOffscreen() { return this.y > gameHeight + 100; }
    }
    
    function spawnObjects() {
        let badProb = Math.min(0.25 + gameIntensity * 0.05, 0.55);
        for(let i=0; i<objectsPerSpawn; i++) {
            let isGood = Math.random() > badProb;
            fallingObjects.push(new FallingItem(isGood));
        }
    }
    
    function updateGame() {
        if(gameState !== 'playing') return;
        player.update();
        if(keys.ArrowLeft) player.move('left');
        if(keys.ArrowRight) player.move('right');
        
        spawnCounter++;
        if(spawnCounter >= spawnRate) { spawnObjects(); spawnCounter = 0; }
        updateIntensityByScore();
        
        for(let i=0; i<fallingObjects.length; i++) {
            const obj = fallingObjects[i];
            obj.update();
            const bounds = obj.getBounds();
            const playerBounds = player.getBounds();
            if(bounds.x < playerBounds.x+playerBounds.width && bounds.x+bounds.width > playerBounds.x &&
               bounds.y < playerBounds.y+playerBounds.height && bounds.y+bounds.height > playerBounds.y) {
                if(obj.isGood) {
                    player.score += obj.value;
                    playGoodCollectSound(); // Sonido al recoger comida buena
                    if(Math.random() < 0.2) {
                        player.applyBoost();
                        boostIndicator.style.display = 'block';
                        setTimeout(()=> boostIndicator.style.display='none', 1000);
                    }
                } else {
                    player.takeDamage(obj.value);
                    playDamageSound(); // Sonido al recibir daño
                    if(player.health <= 0) gameOver();
                }
                fallingObjects.splice(i,1);
                i--;
                continue;
            }
            if(obj.isOffscreen()) { fallingObjects.splice(i,1); i--; }
        }
        gameTimer++;
        updateUI();
        if(player.health <= 0) gameOver();
    }
    
    function gameOver() {
        gameState = 'gameover';
        playGameOverSound();
        stopBackgroundMusic();
        const finalScore = player.score;
        const finalIntensity = gameIntensity;
        const finalTimeSec = Math.floor(gameTimer / 60);
        document.getElementById('finalScore').textContent = finalScore;
        document.getElementById('finalIntensity').textContent = finalIntensity.toFixed(1)+'x';
        let mins = Math.floor(finalTimeSec / 60);
        let secs = finalTimeSec % 60;
        document.getElementById('finalTime').textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        
        let isNew = false;
        if(finalScore > highScore.score) {
            highScore = { score: finalScore, intensity: finalIntensity, time: finalTimeSec };
            localStorage.setItem('fitFrenzyHigh', JSON.stringify(highScore));
            isNew = true;
        }
        document.getElementById('recordScore').textContent = highScore.score;
        let recMins = Math.floor(highScore.time / 60);
        let recSecs = highScore.time % 60;
        document.getElementById('recordDetails').innerHTML = `Intensidad: ${highScore.intensity.toFixed(1)}x | Tiempo: ${recMins.toString().padStart(2,'0')}:${recSecs.toString().padStart(2,'0')}`;
        document.getElementById('newRecordMessage').style.display = isNew ? 'block' : 'none';
        document.getElementById('gameOverScreen').classList.remove('hidden');
        uiContainer.style.display = 'none';
        canvas.style.display = 'none';
    }
    
    function resetGame() {
        player.reset();
        fallingObjects = [];
        spawnCounter = 0;
        gameTimer = 0;
        gameIntensity = 1.0;
        objectsPerSpawn = 1;
        spawnRate = 70;
        updateUI();
        player.health = 100;
        player.score = 0;
    }
    
    function startGame() {
        resetGame();
        gameState = 'playing';
        playStartSound();
        startBackgroundMusic();
        document.getElementById('pixelMenu').classList.add('hidden');
        canvas.style.display = 'block';
        uiContainer.style.display = 'flex';
        document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        updateCanvasSize();
    }
    
    function pauseGame() { if(gameState==='playing') { gameState='paused'; stopBackgroundMusic(); document.getElementById('pauseScreen').classList.remove('hidden'); } }
    function resumeGame() { if(gameState==='paused') { gameState='playing'; startBackgroundMusic(); document.getElementById('pauseScreen').classList.add('hidden'); } }
    function returnToMenu() {
        gameState = 'menu';
        stopBackgroundMusic();
        canvas.style.display = 'none';
        uiContainer.style.display = 'none';
        document.getElementById('pixelMenu').classList.remove('hidden');
        document.getElementById('pauseScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        resetGame();
    }
    
    // Dibujo del juego
    function drawBackground() {
        const grad = ctx.createLinearGradient(0,0,0,gameHeight);
        grad.addColorStop(0,'#0a0a20');
        grad.addColorStop(1,'#151530');
        ctx.fillStyle=grad; ctx.fillRect(0,0,gameWidth,gameHeight);
        ctx.strokeStyle = '#2a4a6a';
        for(let i=0;i<gameWidth+gameHeight;i+=50) {
            ctx.beginPath(); ctx.moveTo(i%gameWidth, 0); ctx.lineTo((i+50)%gameWidth, gameHeight); ctx.stroke();
        }
        ctx.fillStyle = '#2a4a6a';
        ctx.fillRect(0, gameHeight-15, gameWidth, 15);
    }
    
    function drawPlayer() {
        ctx.fillStyle = '#4682b4';
        ctx.shadowBlur = player.speedBoost>0 ? 12 : 0;
        ctx.shadowColor = 'gold';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.beginPath(); ctx.arc(player.x+player.width/2, player.y-12, 16, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f0f0f0';
        ctx.beginPath(); ctx.arc(player.x+player.width/2-5, player.y-16, 3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(player.x+player.width/2+5, player.y-16, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(player.x+player.width/2-5, player.y-16, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(player.x+player.width/2+5, player.y-16, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    function draw() {
        if(gameState !== 'playing') return;
        drawBackground();
        for(let obj of fallingObjects) obj.draw(ctx);
        drawPlayer();
    }
    
    function loadHighScore() {
        const saved = localStorage.getItem('fitFrenzyHigh');
        if(saved) {
            try { highScore = JSON.parse(saved); } catch(e) {}
        }
    }
    
    function initTouchControls() {
        const canvasElem = canvas;
        function handleTouch(e) {
            if(gameState !== 'playing') return;
            e.preventDefault();
            const rect = canvasElem.getBoundingClientRect();
            const scaleX = gameWidth / rect.width;
            if(e.touches.length > 0) {
                let canvasX = (e.touches[0].clientX - rect.left) * scaleX;
                canvasX = Math.min(Math.max(canvasX, 0), gameWidth);
                if(canvasX < gameWidth/2) {
                    keys.ArrowLeft = true;
                    keys.ArrowRight = false;
                } else {
                    keys.ArrowLeft = false;
                    keys.ArrowRight = true;
                }
            }
        }
        function handleTouchEnd(e) {
            if(gameState !== 'playing') return;
            e.preventDefault();
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
        }
        canvasElem.addEventListener('touchstart', handleTouch, { passive: false });
        canvasElem.addEventListener('touchmove', handleTouch, { passive: false });
        canvasElem.addEventListener('touchend', handleTouchEnd);
        canvasElem.addEventListener('touchcancel', handleTouchEnd);
    }
    
    // Lluvia de comida en el menú
    let rainInterval = null;
    function createFoodElement(food) {
        const div = document.createElement('div');
        div.className = 'food-rain';
        const size = 30 + Math.random() * 20;
        div.style.width = `${size}px`;
        div.style.height = `${size}px`;
        div.style.left = Math.random() * 100 + '%';
        const duration = 3 + Math.random() * 5;
        div.style.animationDuration = `${duration}s`;
        div.style.animationDelay = `${Math.random() * 5}s`;
        
        const canvasRain = document.createElement('canvas');
        canvasRain.width = size;
        canvasRain.height = size;
        const ctxRain = canvasRain.getContext('2d');
        const shape = food.shape;
        const color = food.color;
        const center = size/2;
        const rad = size/2 * 0.8;
        
        ctxRain.clearRect(0, 0, size, size);
        ctxRain.fillStyle = color;
        ctxRain.shadowBlur = 0;
        
        if(shape === 'circle') {
            ctxRain.beginPath();
            ctxRain.arc(center, center, rad, 0, Math.PI*2);
            ctxRain.fill();
        } else if(shape === 'square') {
            const side = rad * 1.4;
            ctxRain.fillRect(center - side/2, center - side/2, side, side);
        } else if(shape === 'triangle') {
            const altura = rad * 1.6;
            ctxRain.beginPath();
            ctxRain.moveTo(center, center - altura/2);
            ctxRain.lineTo(center - rad, center + altura/2);
            ctxRain.lineTo(center + rad, center + altura/2);
            ctxRain.fill();
        } else if(shape === 'diamond') {
            ctxRain.beginPath();
            ctxRain.moveTo(center, center - rad);
            ctxRain.lineTo(center + rad, center);
            ctxRain.lineTo(center, center + rad);
            ctxRain.lineTo(center - rad, center);
            ctxRain.fill();
        }
        
        if(BAD_FOODS.some(b => b.id === food.id)) {
            ctxRain.strokeStyle = 'black';
            ctxRain.lineWidth = 2;
            ctxRain.beginPath();
            ctxRain.moveTo(center - rad/1.5, center - rad/1.5);
            ctxRain.lineTo(center + rad/1.5, center + rad/1.5);
            ctxRain.stroke();
            ctxRain.beginPath();
            ctxRain.moveTo(center + rad/1.5, center - rad/1.5);
            ctxRain.lineTo(center - rad/1.5, center + rad/1.5);
            ctxRain.stroke();
        } else {
            ctxRain.fillStyle = 'rgba(255,255,255,0.6)';
            ctxRain.beginPath();
            ctxRain.arc(center - rad/3, center - rad/3, rad/5, 0, Math.PI*2);
            ctxRain.fill();
        }
        
        div.appendChild(canvasRain);
        return div;
    }
    
    function startRainEffect() {
        const menuDiv = document.getElementById('pixelMenu');
        const existingRain = menuDiv.querySelectorAll('.food-rain');
        existingRain.forEach(el => el.remove());
        for(let i = 0; i < 60; i++) {
            const randomFood = ALL_FOODS[Math.floor(Math.random() * ALL_FOODS.length)];
            const foodElement = createFoodElement(randomFood);
            menuDiv.appendChild(foodElement);
        }
        if(rainInterval) clearInterval(rainInterval);
        rainInterval = setInterval(() => {
            if(gameState === 'menu') {
                const randomFood = ALL_FOODS[Math.floor(Math.random() * ALL_FOODS.length)];
                const newFood = createFoodElement(randomFood);
                document.getElementById('pixelMenu').appendChild(newFood);
                const allItems = document.querySelectorAll('.food-rain');
                if(allItems.length > 100) allItems[0].remove();
            }
        }, 600);
    }
    
    function stopRainEffect() {
        if(rainInterval) clearInterval(rainInterval);
        const menuDiv = document.getElementById('pixelMenu');
        const rainItems = menuDiv.querySelectorAll('.food-rain');
        rainItems.forEach(el => el.remove());
    }
    
    // Inicialización
    function init() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        updateCanvasSize();
        window.addEventListener('resize', () => { updateCanvasSize(); });
        player.y = gameHeight - 90;
        player.x = gameWidth/2 - player.width/2;
        loadHighScore();
        startRainEffect();
        
        // Botones del menú con sonido
        const menuJugar = document.getElementById('menuJugar');
        const menuOpciones = document.getElementById('menuOpciones');
        const menuSalir = document.getElementById('menuSalir');
        
        menuJugar.addEventListener('click', () => { playClickSound(); startGame(); });
        menuOpciones.addEventListener('click', () => { playClickSound(); alert("Opciones próximamente..."); });
        menuSalir.addEventListener('click', () => { playClickSound(); alert("Gracias por jugar Fit Frenzy"); });
        
        // Controles de teclado
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') keys.ArrowLeft = true;
            if(e.key === 'ArrowRight') keys.ArrowRight = true;
            if(e.key === 'p' || e.key === 'P') {
                if(gameState === 'playing') pauseGame();
                else if(gameState === 'paused') resumeGame();
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft') keys.ArrowLeft = false;
            if(e.key === 'ArrowRight') keys.ArrowRight = false;
        });
        
        // Botones de pausa y game over con sonido
        document.getElementById('resumeButton').onclick = () => { playClickSound(); resumeGame(); };
        document.getElementById('restartButton').onclick = () => { playClickSound(); startGame(); };
        document.getElementById('playAgainButton').onclick = () => { playClickSound(); startGame(); };
        document.getElementById('menuButton').onclick = () => { playClickSound(); returnToMenu(); };
        document.getElementById('menuButton2').onclick = () => { playClickSound(); returnToMenu(); };
        
        initTouchControls();
        
        canvas.style.display = 'none';
        uiContainer.style.display = 'none';
        
        function animate() {
            updateGame();
            draw();
            requestAnimationFrame(animate);
        }
        animate();
    }
    
    init();
</script>
</body>
